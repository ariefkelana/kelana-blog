<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ .Title }} | {{ .Site.Title }}</title>
    <!-- Menghubungkan ke file CSS -->
    <link rel="stylesheet" href="{{ "css/style.css" | relURL }}">
</head>
<body>
    <header>
        <div class="container">
            <h1><a href="{{ .Site.BaseURL }}">{{ .Site.Title }}</a></h1>
            <nav>
                <a href="{{ .Site.BaseURL }}">Beranda</a>
                <a href="{{ "posts/" | relURL }}">Artikel</a>
            </nav>
        </div>
    </header>

    <main class="container">
        <!-- Bagian ini akan diisi secara dinamis -->
        {{ block "main" . }}
        {{ end }}
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2026 Arief Kelana. Dibuat dengan Hugo.</p>
        </div>
    </footer>
</body>
</html>
