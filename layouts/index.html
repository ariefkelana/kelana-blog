{{ define "main" }}
  <section class="hero">
    <h2>Selamat Datang di Blog Saya</h2>
    <!-- Ini akan memanggil isi dari file content/_index.md -->
    {{ .Content }}
  </section>

  <section class="recent-posts">
    <h3>Artikel Terbaru</h3>
    <ul>
      <!-- Looping untuk menampilkan artikel terbaru -->
      {{ range first 3 (where .Site.RegularPages "Type" "posts") }}
        <li>
          <a href="{{ .Permalink }}">{{ .Title }}</a>
          <small>({{ .Date.Format "02 Jan 2006" }})</small>
        </li>
      {{ end }}
    </ul>
  </section>
{{ end }}
